<!DOCTYPE html>
<html>

<head>

    <title>View Resume</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .container {
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h3 {
            text-align: center;
            color: #1e293b;
            font-size: 26px;
            margin-bottom: 30px;
        }

        .detail {
            margin-bottom: 20px;
            color: #334155;
            font-size: 16px;
        }

        .label {
            font-weight: bold;
            color: #475569;
        }

        .resume-link {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .resume-link:hover {
            color: #4338ca;
            text-decoration: underline;
        }

        .dashboard-btn {
            display: block;
            width: 240px;
            margin: 30px auto 0;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #4338ca;
        }

    </style>

</head>

<body>

<div class="container">

    <h3>Resume</h3>

    <div class="detail">
        <span class="label">rid:</span>
        <span th:text="${session.rr.rid}"></span>
    </div>

    <div class="detail">
        <span class="label">Resume Name:</span>

        <a th:href="@{/openresume(candid=${session.rr.cid.candid})}"
           target="_blank"
           class="resume-link">

            <span th:text="${session.rr.resumename}"></span>

        </a>
    </div>

    <div class="detail">
        <span class="label">Uploaded Date:</span>
        <span th:text="${session.rr.uploadeddate}"></span>
    </div>

    <a href="/Recrruiterdashboard" class="dashboard-btn">
        Return Recruiter Dashboard
    </a>

</div>

</body>

</html>
