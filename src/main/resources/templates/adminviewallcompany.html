
<html>

<head>

<title>Company Details</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    padding: 30px;
}

h2{
    text-align: center;
    color: #333;
}

table{
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    box-shadow: 0px 0px 10px gray;
}

th, td{
    padding: 10px;
    text-align: center;
    border: 1px solid #ddd;
}

th{
    background-color: #333;
    color: white;
}

tr:hover{
    background-color: #f1f1f1;
}

button{
    padding: 7px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.dashboard{
    margin-bottom: 20px;
    padding: 10px 18px;
    background-color: #333;
    color: white;
}

.update{
    background-color: #555;
    color: white;
}

.delete{
    background-color: #c0392b;
    color: white;
}

.dashboard:hover{
    background-color: #555;
}

.update:hover{
    background-color: #333;
}

.delete:hover{
    background-color: #a93226;
}

</style>

</head>

<body>

<a href="/Admindashoard">
    <button class="dashboard">Admin Dashboard</button>
</a>

<h2>Company Details</h2>

<table>

<tr>
<td>CompanyId</td>
<td>CompanyName</td>
<td>Email</td>
<td>Address</td>
<td>Website</td>
<td>Description</td>
<td>Active</td>
<td>Aid</td>
<td>AdminName</td>
<td>PhoneNumber</td>
<td>Update</td>
<td>Delete</td>
</tr>

<tr th:each="c : ${session.ccc}" th:if="${c.active}">

<td th:text="${c.cid}"></td>
<td th:text="${c.cname}"></td>
<td th:text="${c.email}"></td>
<td th:text="${c.address}"></td>
<td th:text="${c.website}"></td>
<td th:text="${c.description}"></td>
<td th:text="${c.active}"></td>
<td th:text="${c.admin.aid}"></td>
<td th:text="${c.admin.name}"></td>
<td th:text="${c.admin.phonenum}"></td>

<td>

<form action="/updatecomp" method="get">

<input type="hidden" th:value="${c.cid}" name="cid">

<button type="submit" class="update">Update</button>

</form>

</td>

<td>

<form action="/deletecomp" method="post">

<input type="hidden" name="_method" value="DELETE">

<input type="hidden" th:value="${c.cid}" name="cid">

<button type="submit" class="delete">DELETE</button>

</form>

</td>

</tr>

</table>

</body>

</html>
