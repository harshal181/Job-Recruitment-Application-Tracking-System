
<html>

<head>

<title>My Profile</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .profile-card {
        width: 500px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h3 {
        text-align: center;
        color: #1e293b;
        font-size: 26px;
        margin-bottom: 30px;
    }

    .profile-row {
        display: flex;
        justify-content: space-between;
        padding: 14px 5px;
        border-bottom: 1px solid #e2e8f0;
        color: #334155;
    }

    .label {
        font-weight: bold;
        color: #475569;
    }

    .value {
        color: #1e293b;
        text-align: right;
        word-break: break-word;
    }

    .dashboard-btn {
        display: block;
        width: 100%;
        margin-top: 28px;
        padding: 13px;
        text-align: center;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.3s;
    }

    .dashboard-btn:hover {
        background: #4338ca;
    }
</style>

</head>

<body>

<div class="profile-card">

    <h3>My Profile</h3>

    <div class="profile-row">
        <span class="label">Aid:</span>
        <span class="value" th:text="${session.ad.aid}"></span>
    </div>

    <div class="profile-row">
        <span class="label">Name:</span>
        <span class="value" th:text="${session.ad.name}"></span>
    </div>

    <div class="profile-row">
        <span class="label">Email:</span>
        <span class="value" th:text="${session.ad.email}"></span>
    </div>

    <div class="profile-row">
        <span class="label">Password:</span>
        <span class="value" th:text="${session.ad.password}"></span>
    </div>

    <div class="profile-row">
        <span class="label">PhoneNumber:</span>
        <span class="value" th:text="${session.ad.phonenum}"></span>
    </div>

    <a href="/Admindashoard" class="dashboard-btn">
        Return Dashboard
    </a>

</div>

</body>

</html>
