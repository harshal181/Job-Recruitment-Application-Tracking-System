
<html>

<head>

<title>Application Candidates</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 30px;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow-x: auto;
    }

    h2 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 25px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
    }

    th {
        background: #4f46e5;
        color: white;
        padding: 13px 10px;
        text-align: center;
    }

    td {
        padding: 12px 10px;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
        color: #334155;
    }

    tr:hover {
        background: #f8fafc;
    }

    button {
        padding: 8px 14px;
        border: none;
        border-radius: 7px;
        background: #4f46e5;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #4338ca;
    }

    .dashboard-btn {
        display: block;
        width: 220px;
        margin: 25px auto 0;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        background: #e2e8f0;
        color: #334155;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #cbd5e1;
    }
</style>

</head>

<body>

<div class="container">

<h2>Applied Candidates</h2>

<table>

<tr>
    <th>ApplicationId</th>
    <th>Candid</th>
    <th>Name</th>
    <th>Resume</th>
    <th>Skill</th>
</tr>

<tr th:each="a3 : ${session.ar}" thif="${a3.cid.active}" th:if="${a3.cid.active}">

    <td th:text="${a3.appid}"></td>

    <td th:text="${a3.cid.candid}"></td>

    <td th:text="${a3.cid.name}"></td>

    <td>
        <form action="/viewresume" method="get">

            <input type="hidden"
                   th:value="${a3.cid.candid}"
                   name="candid">

            <button type="submit">View Resume</button>

        </form>
    </td>

    <td>
        <form action="/viewskills" method="get">

            <input type="hidden"
                   th:value="${a3.cid.candid}"
                   name="candid">

            <button type="submit">View Skills</button>

        </form>
    </td>

</tr>

</table>

<a href="/Recrruiterdashboard" class="dashboard-btn">
    Return Recruiter Dashboard
</a>

</div>

</body>

</html>
