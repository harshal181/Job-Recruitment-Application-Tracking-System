
<html>

<head>

<title>View All Jobs</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 30px;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        min-height: 100vh;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow-x: auto;
    }

    h2 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 25px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 950px;
    }

    th {
        background: #4f46e5;
        color: white;
        padding: 13px 10px;
        text-align: center;
    }

    td {
        padding: 12px 10px;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
        color: #334155;
    }

    tr:hover {
        background: #f8fafc;
    }

    .skill {
        display: inline-block;
        background: #eef2ff;
        color: #4338ca;
        padding: 5px 9px;
        margin: 2px;
        border-radius: 6px;
        font-size: 13px;
    }

    .delete-btn {
        background: #dc2626;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .delete-btn:hover {
        background: #b91c1c;
    }

    .dashboard-btn {
        display: block;
        width: 220px;
        margin: 25px auto 0;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #4338ca;
    }
</style>

</head>

<body>

<div class="container">

<h2>View All Jobs</h2>

<table>

<tr>
    <th>Jid</th>
    <th>JobTitle</th>
    <th>JobType</th>
    <th>Salary</th>
    <th>Experience_required</th>
    <th>Location</th>
    <th>RequiredSkill</th>
    <th>PostedDate</th>
    <th>Companyid</th>
    <th>CompanyName</th>
    <th>Delete</th>
</tr>

<tr th:each="jj : ${session.j1}"  th:if="${jj.active and jj.company.active}">

    <td th:text="${jj.jid}"></td>

    <td th:text="${jj.jobtitle}"></td>

    <td th:text="${jj.jobtype}"></td>

    <td th:text="${jj.salary}"></td>

    <td th:text="${jj.experience_required}"></td>

    <td th:text="${jj.location}"></td>

    <td>
        <span class="skill"
              th:each="jss : ${jj.js}"
              th:text="${jss.jobskillname}">
        </span>
    </td>

    <td th:text="${jj.postedDate}"></td>

    <td th:text="${jj.company.cid}"></td>
    
    <td th:text="${jj.company.cname}"></td>

    <td>
        <form th:action="@{/deletejobs}" method="post">

            <input type="hidden"
                   name="jid"
                   th:value="${jj.jid}"
                   required>

            <button type="submit" class="delete-btn">
                Delete
            </button>

        </form>
    </td>

</tr>

</table>

<a href="/Recrruiterdashboard" class="dashboard-btn">
    Return Recruiter Dashboard
</a>

</div>

</body>

</html>
