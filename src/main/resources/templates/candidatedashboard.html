
<html>

<head>

<title>Candidate Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(160deg, #eef2ff, #f8fafc);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Mobile App */
.app {
    width: 390px;
    min-height: 720px;
    background: #ffffff;
    border-radius: 32px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    overflow: hidden;
}

/* Header */
.header {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    padding: 32px 25px 38px;
    color: white;
    border-radius: 0 0 30px 30px;
}

.header .profile-icon {
    width: 65px;
    height: 65px;
    background: rgba(255, 255, 255, 0.20);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    margin-bottom: 16px;
}

.header h3 {
    font-size: 27px;
    margin-bottom: 7px;
}

.header p {
    font-size: 14px;
    opacity: 0.9;
}

/* Menu */
.menu {
    padding: 22px 20px 15px;
}

.menu-title {
    font-size: 13px;
    color: #64748b;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 13px;
}

/* Menu Items */
.menu a {
    display: flex;
    align-items: center;
    text-decoration: none;
    background: #f8fafc;
    color: #1e293b;
    padding: 13px;
    margin-bottom: 10px;
    border-radius: 15px;
    border: 1px solid #e2e8f0;
    transition: 0.25s;
}

.menu a:hover {
    background: #eef2ff;
    border-color: #c7d2fe;
    transform: translateY(-2px);
}

/* Icon */
.menu-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    margin-right: 14px;
}

/* Text */
.menu-text {
    font-size: 15px;
    font-weight: bold;
    flex: 1;
}

.arrow {
    font-size: 20px;
    color: #94a3b8;
}

/* Logout */
.logout a {
    background: #fff1f2;
    border-color: #fecdd3;
    color: #be123c;
}

.logout .menu-icon {
    background: #ffe4e6;
}

/* Footer */
.footer {
    text-align: center;
    padding: 3px 20px 20px;
    color: #94a3b8;
    font-size: 11px;
}

</style>

</head>

<body>

<div class="app">

    <!-- Header -->
    <div class="header">

        <div class="profile-icon">
            👨‍🎓
        </div>

        <h3>Welcome Candidate</h3>

        <p>Manage your job applications</p>

    </div>


    <!-- Menu -->
    <div class="menu">

        <div class="menu-title">
            Profile
        </div>

        <a href="/updatecadidate">

            <div class="menu-icon">✏️</div>

            <div class="menu-text">
                Update Profile
            </div>

            <div class="arrow">›</div>

        </a>


        <a href="/viewprofileforcandidate">

            <div class="menu-icon">👤</div>

            <div class="menu-text">
                My Profile
            </div>

            <div class="arrow">›</div>

        </a>


        <div class="menu-title" style="margin-top:20px;">
            Jobs & Applications
        </div>


        <a href="/ViewAllJob">

            <div class="menu-icon">💼</div>

            <div class="menu-text">
                All Jobs
            </div>

            <div class="arrow">›</div>

        </a>


        <a href="/viewmyappliedjobs">

            <div class="menu-icon">📋</div>

            <div class="menu-text">
                My Applied JOBS
            </div>

            <div class="arrow">›</div>

        </a>


        <div class="menu-title" style="margin-top:20px;">
            Resume & Skills
        </div>


        <a href="/addresume">

            <div class="menu-icon">📄</div>

            <div class="menu-text">
                Upload Resume
            </div>

            <div class="arrow">›</div>

        </a>


        <a href="/updateresume">

            <div class="menu-icon">📝</div>

            <div class="menu-text">
                Update Resume
            </div>

            <div class="arrow">›</div>

        </a>


        <a href="/addskill">

            <div class="menu-icon">➕</div>

            <div class="menu-text">
                Add Skill
            </div>

            <div class="arrow">›</div>

        </a>


        <a href="/viewallskill">

            <div class="menu-icon">⭐</div>

            <div class="menu-text">
                View All Skills
            </div>

            <div class="arrow">›</div>

        </a>


        <div class="logout">

            <a href="/logout">

                <div class="menu-icon">🚪</div>

                <div class="menu-text">
                    Logout
                </div>

                <div class="arrow">›</div>

            </a>

        </div>

    </div>


    <div class="footer">
        Job Recruitment & Application Tracking System
    </div>

</div>

</body>

</html>
