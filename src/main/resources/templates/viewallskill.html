
<!DOCTYPE html>

<html>

<head>

<title>Skills List</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .container {
        width: 650px;
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h2 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 25px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 10px;
    }

    th {
        background: #4f46e5;
        color: white;
        padding: 14px;
        text-align: center;
    }

    td {
        padding: 13px;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
        color: #334155;
    }

    tr:hover {
        background: #f8fafc;
    }

    .skill-name {
        font-weight: bold;
        color: #4338ca;
    }

    .dashboard-btn {
        display: block;
        width: 230px;
        margin: 25px auto 0;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        background: #4f46e5;
        color: white;
        border-radius: 8px;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #4338ca;
    }

</style>

</head>

<body>

<div class="container">

    <h2>Skills List</h2>

    <table>

        <tr>
            <th>SkillName</th>
            <th>SkillLevel</th>
        </tr>

        <tr th:each="s1 : ${session.ss}">

            <td class="skill-name"
                th:text="${s1.skillname}">
            </td>

            <td th:text="${s1.skilllevel}">
            </td>

        </tr>

    </table>

    <a href="/Candidatedashboardd" class="dashboard-btn">
        Return Candidate Dashboard
    </a>

</div>

</body>

</html>
