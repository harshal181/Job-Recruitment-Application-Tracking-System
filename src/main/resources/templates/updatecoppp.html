
<html>

<head>
<title>Update Company Details</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

.form-container {
    width: 500px;
    margin: 40px auto;
    background: white;
    padding: 30px 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #243b55;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    color: #333;
    font-weight: bold;
}

input[type="text"],
select {
    width: 100%;
    padding: 11px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

input[type="text"]:focus,
select:focus {
    border-color: #243b55;
}

.current-admin {
    display: block;
    margin-top: 20px;
    padding: 10px;
    background: #f1f4f8;
    border-radius: 6px;
    color: #333;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #243b55;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #141e30;
}
</style>

</head>

<body>

<div class="form-container">

<h2>Update Company Details</h2>

<form action="/updatecompp" method="post">

<input type="hidden" name="_method" value="PUT">

<input type="hidden" th:value="${session.cc.cid}" name="cid">

<label>Enter CompanyName:</label>
<input type="text" th:value="${session.cc.cname}" name="cn">

<label>Enter Email:</label>
<input type="text" th:value="${session.cc.email}" name="ee">

<label>Enter Address:</label>
<input type="text" th:value="${session.cc.address}" name="ad">

<label>Enter Website:</label>
<input type="text" th:value="${session.cc.website}" name="w">

<label>Enter Description:</label>
<input type="text" th:value="${session.cc.description}" name="d">

<div class="current-admin">
    <b>Current aid:</b>
    <span th:text="${session.cc.admin.aid}"></span>
</div>

<label>Select Admin:</label>

<select name="aid">

<option
    th:each="a1: ${session.a}"
    th:text="${a1.aid}"
    th:value="${a1.aid}"
    th:selected="${session.cc.admin!=null and session.cc.admin.aid==a1.aid}"
    th:if="${a1.active}">
</option>

</select>

<button type="submit">Update Company Details</button>

</form>

</div>

</body>

</html>
