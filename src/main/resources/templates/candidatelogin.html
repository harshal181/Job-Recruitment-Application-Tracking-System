
<html>

<head>

<title>Candidate Login</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .login-container {
        width: 420px;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #eef2ff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
    }

    .login-header h2 {
        margin: 0;
        color: #1e293b;
        font-size: 27px;
    }

    .login-header p {
        margin: 8px 0 0;
        color: #64748b;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background: white;
        transition: 0.2s;
    }

    input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        margin-top: 5px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-btn:hover {
        background: #4338ca;
    }

</style>

</head>

<body>

<div class="login-container">

    <div class="login-header">

        <div class="login-icon">👤</div>

        <h2>Candidate Login</h2>

        <p>Login to access your candidate dashboard</p>

    </div>

    <form action="/candidatellogin" method="get">

        <div class="form-group">

            <label>Candidate Id:</label>

            <input type="number" name="cid" required>

        </div>

        <div class="form-group">

            <label>Password:</label>

            <input type="text" name="pp" required>

        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

</div>

</body>

</html>
