
<html>

<head>

<title>Manage All Users</title>

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 30px;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        min-height: 100vh;
    }

    .container {
        max-width: 1250px;
        margin: auto;
    }

    .main-title {
        text-align: center;
        color: #1e293b;
        margin-bottom: 30px;
    }

    .section {
        background: white;
        padding: 25px;
        margin-bottom: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        overflow-x: auto;
    }

    h3 {
        color: #1e293b;
        margin-bottom: 18px;
        border-left: 5px solid #4f46e5;
        padding-left: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 750px;
    }

    th {
        background: #4f46e5;
        color: white;
        padding: 13px 10px;
        text-align: center;
    }

    td {
        padding: 11px 10px;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
        color: #334155;
    }

    tr:hover {
        background: #f8fafc;
    }

    .delete-btn {
        background: #dc2626;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }

    .delete-btn:hover {
        background: #b91c1c;
    }

    .dashboard-btn {
        display: block;
        width: 230px;
        margin: 10px auto 30px;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #4338ca;
    }
</style>

</head>

<body>

<div class="container">

<h2 class="main-title">Manage All Users</h2>


<div class="section">

<h3>All Admin</h3>

<table>

<tr>
    <th>Aid</th>
    <th>Name</th>
    <th>Email</th>
    <th>Password</th>
    <th>Phone Number</th>
    <th>Delete</th>
</tr>

<tr th:each="a1 : ${session.a}" th:if="${a1.active}">

    <td th:text="${a1.aid}"></td>
    <td th:text="${a1.name}"></td>
    <td th:text="${a1.email}"></td>
    <td th:text="${a1.password}"></td>
    <td th:text="${a1.phonenum}"></td>

<td>
<form action="/deleteadmin" method="post">
<input type="hidden" name="_method" value="DELETE">
<input type="hidden" th:value="${a1.aid}" name="aid">
<button type="submit">Delete</button>

</form>

</td>

</tr>

</table>

</div>


<div class="section">

<h3>All Recruiter</h3>

<table>

<tr>
    <th>Rrid</th>
    <th>Name</th>
    <th>Email</th>
    <th>Password</th>
    <th>Address</th>
    <th>Cid</th>
    <th>Delete</th>
</tr>

<tr th:each="rr : ${session.r}" th:if="${rr.active}">

    <td th:text="${rr.rrid}"></td>
    <td th:text="${rr.name}"></td>
    <td th:text="${rr.email}"></td>
    <td th:text="${rr.password}"></td>
    <td th:text="${rr.address}"></td>
    <td th:text="${rr.cid.cid}"></td>

    <td>
        <form action="/deleterecruiter" method="post">
        <input type="hidden" name="_method" value="DELETE"><br>
        <input type="hidden" th:value="${rr.rrid}" name="rrid"><br>
        <button type="submit">DELETE</button>
        
        
        </form>
    </td>

</tr>

</table>

</div>


<div class="section">

<h3>All Candidate</h3>

<table>

<tr>
    <th>Candid</th>
    <th>Name</th>
    <th>Email</th>
    <th>Password</th>
    <th>Education</th>
    <th>Address</th>
    <th>Phone Number</th>
    <th>Date of Borth</th>
    <th>Delete</th>
</tr>

<tr th:each="c1 : ${session.c}" th:if="${c1.active}">

    <td th:text="${c1.candid}"></td>
    <td th:text="${c1.name}"></td>
    <td th:text="${c1.email}"></td>
    <td th:text="${c1.password}"></td>
    <td th:text="${c1.education}"></td>
    <td th:text="${c1.address}"></td>
    <td th:text="${c1.phonenum}"></td>
    <td th:text="${c1.dob}"></td>

    <td>
      <form action="/deletecandidate" method="post">
      <input type="hidden" name="_method" value="DELETE"><br>
        <input type="hidden" th:value="${c1.candid}" name="cid"><br>
         <Button type="submit">DELETE</Button>
      
      </form>
    </td>

</tr>

</table>

</div>


<a href="/Admindashoard" class="dashboard-btn">
    Return Admin Dashboard
</a>

</div>

</body>

</html>
