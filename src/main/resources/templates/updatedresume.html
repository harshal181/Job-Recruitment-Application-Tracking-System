
<html>

<head>
<title>Update Resume</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .container {
        width: 450px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #1e293b;
    }

    .current-resume {
        background: #f1f5f9;
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 22px;
        color: #334155;
    }

    .current-resume span {
        font-weight: bold;
        color: #4f46e5;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #334155;
    }

    input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        margin-bottom: 20px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #4338ca;
    }

    .dashboard-btn {
        display: block;
        text-align: center;
        text-decoration: none;
        margin-top: 15px;
        padding: 11px;
        border-radius: 8px;
        background: #e2e8f0;
        color: #334155;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #cbd5e1;
    }
</style>

</head>

<body>

<div class="container">

    <h2>Update Resume</h2>

    <form action="/updatedresume" method="post" enctype="multipart/form-data">

        <div class="current-resume">
            Current Resume:
            <span th:text="${session.rr.resumename}"></span>
        </div>

        <label>Enter UptadedResume</label>

        <input type="file"
               accept=".pdf,.dc,.docx"
               name="ur"
               required>

        <button type="submit">Updated Resume</button>

    </form>

    <a href="/Candidatedashboardd" class="dashboard-btn">
        Return Dashboard
    </a>

</div>

</body>

</html>
