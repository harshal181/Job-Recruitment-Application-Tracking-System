
<!DOCTYPE html>

<html>

<head>

<title>Interview Details</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 600px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        overflow: hidden;
    }

    .header {
        background: #4f46e5;
        padding: 25px 30px;
        text-align: center;
        color: white;
    }

    .header h3 {
        margin: 0;
        font-size: 25px;
    }

    .header p {
        margin: 7px 0 0;
        font-size: 13px;
        opacity: 0.9;
    }

    .details {
        padding: 25px 30px;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 5px;
        border-bottom: 1px solid #e2e8f0;
        gap: 20px;
    }

    .detail-row:last-child {
        border-bottom: none;
    }

    .label {
        color: #475569;
        font-size: 14px;
        font-weight: bold;
    }

    .value {
        color: #1e293b;
        font-size: 14px;
        text-align: right;
        word-break: break-word;
    }

    .status {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 12px;
        font-weight: bold;
    }

    .dashboard-btn {
        display: block;
        width: 230px;
        margin: 0 auto 25px;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        background: #4f46e5;
        color: white;
        border-radius: 8px;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #4338ca;
    }

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h3>Interview Details</h3>

        <p>Interview information and application details</p>

    </div>

    <div class="details">

        <div class="detail-row">

            <span class="label">InterviewId:</span>

            <span class="value"
                  th:text="${session.iss.interviewid}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">InterviewDate:</span>

            <span class="value"
                  th:text="${session.iss.interviewdate}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">InterviewTime:</span>

            <span class="value"
                  th:text="${session.iss.interviewTime}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">Round:</span>

            <span class="value"
                  th:text="${session.iss.round}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">Mode:</span>

            <span class="value"
                  th:text="${session.iss.mode}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">MeetingLink:</span>

            <span class="value"
                  th:text="${session.iss.meetinglink}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">Status:</span>

            <span class="status"
                  th:text="${session.iss.status}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">Feedback:</span>

            <span class="value"
                  th:text="${session.iss.feedback}">
            </span>

        </div>

        <div class="detail-row">

            <span class="label">ApplicationId:</span>

            <span class="value"
                  th:text="${session.iss.ap.appid}">
            </span>

        </div>

    </div>

    <a href="/Candidatedashboardd" class="dashboard-btn">
        Return Candidate Dashboard
    </a>

</div>

</body>

</html>
