
<!DOCTYPE html>

<html>

<head>

<title>All Jobs List</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 30px;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        min-height: 100vh;
    }

    .container {
        max-width: 1250px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        overflow-x: auto;
    }

    h3 {
        text-align: center;
        color: #1e293b;
        margin-bottom: 25px;
        font-size: 25px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1050px;
    }

    th {
        background: #4f46e5;
        color: white;
        padding: 13px 10px;
        text-align: center;
        font-size: 14px;
    }

    td {
        padding: 12px 10px;
        text-align: center;
        border-bottom: 1px solid #e2e8f0;
        color: #334155;
        font-size: 14px;
    }

    tr:hover {
        background: #f8fafc;
    }

    .skill {
        display: inline-block;
        background: #eef2ff;
        color: #4338ca;
        padding: 5px 9px;
        margin: 2px;
        border-radius: 6px;
        font-size: 13px;
    }

    .cover-label {
        display: block;
        font-weight: bold;
        color: #334155;
        margin-bottom: 7px;
    }

    .cover-input {
        width: 180px;
        padding: 9px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        outline: none;
        margin-bottom: 8px;
    }

    .cover-input:focus {
        border-color: #4f46e5;
    }

    .apply-btn {
        padding: 9px 18px;
        border: none;
        border-radius: 7px;
        background: #4f46e5;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .apply-btn:hover {
        background: #4338ca;
    }

    .dashboard-btn {
        display: block;
        width: 220px;
        margin: 25px auto 0;
        padding: 12px;
        text-align: center;
        text-decoration: none;
        background: #4f46e5;
        color: white;
        border-radius: 8px;
        font-weight: bold;
    }

    .dashboard-btn:hover {
        background: #4338ca;
    }

</style>

</head>

<body>

<div class="container">

    <h3>All Jobs List</h3>

    <table>

        <tr>

            <th>Jid</th>
            <th>JobTitle</th>
            <th>JobType</th>
            <th>Location</th>
            <th>Salary</th>
            <th>Experience_Required</th>
            <th>Companyid</th>
            <th>Company Name</th>
            <th>PostedDate</th>
            <th>Required Skills</th>
            <th>Apply</th>

        </tr>

        <tr th:each="jj : ${session.j1}"
            th:if="${jj.active and jj.company.active}">

            <td th:text="${jj.jid}"></td>

            <td th:text="${jj.jobtitle}"></td>

            <td th:text="${jj.jobtype}"></td>

            <td th:text="${jj.location}"></td>

            <td th:text="${jj.salary}"></td>

            <td th:text="${jj.experience_required}"></td>

            <td th:text="${jj.company.cid}"></td>
            
            <td th:text="${jj.company.cname}"></td>

            <td th:text="${jj.postedDate}"></td>

            <td>

                <span class="skill"
                      th:each="js2 : ${jj.js}"
                      th:text="${js2.jobskillname}">
                </span>

            </td>

            <td>

                <form th:action="@{/applyjob}" method="post">

                    <input type="hidden"
                           name="jid"
                           th:value="${jj.jid}">

                    <label class="cover-label">
                        CoverLetter
                    </label>

                    <input type="text"
                           name="cr"
                           required
                           class="cover-input">

                    <button type="submit" class="apply-btn">
                        Apply
                    </button>

                </form>

            </td>

        </tr>

    </table>

    <a href="/Candidatedashboardd" class="dashboard-btn">
        Return Candidate Dashboard
    </a>

</div>

</body>

</html>
