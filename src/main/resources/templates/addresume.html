
<html>

<head>

<title>Upload Resume</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .container {
        width: 480px;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        text-align: center;
    }

    .icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #eef2ff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
    }

    h2 {
        margin: 0;
        color: #1e293b;
        font-size: 27px;
    }

    .description {
        margin: 9px 0 28px;
        color: #64748b;
        font-size: 14px;
    }

    .upload-box {
        border: 2px dashed #cbd5e1;
        border-radius: 10px;
        padding: 25px 15px;
        margin-bottom: 22px;
        background: #f8fafc;
    }

    .upload-box label {
        display: block;
        margin-bottom: 12px;
        color: #334155;
        font-size: 14px;
        font-weight: bold;
    }

    input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: white;
        font-size: 13px;
        cursor: pointer;
    }

    .submit-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .submit-btn:hover {
        background: #4338ca;
    }

    .note {
        margin-top: 15px;
        color: #94a3b8;
        font-size: 12px;
    }

</style>

</head>

<body>

<div class="container">

    <div class="icon">📄</div>

    <h2>Upload Resume</h2>

    <p class="description">
        Upload your resume to complete your candidate profile
    </p>

    <form action="uploadresume" method="post" enctype="multipart/form-data">

        <div class="upload-box">

            <label>Upload Resume:</label>

            <input type="file"
                   name="resume"
                   accept=".pdf,.dc,.docx">

        </div>

        <button type="submit" class="submit-btn">
            Submit
        </button>

    </form>

    <div class="note">
        Supported formats: PDF, DOC, DOCX
    </div>

</div>

</body>

</html>
