
<html>
<head>
<title>Create Company</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

.form-container {
    width: 450px;
    margin: 60px auto;
    background: white;
    padding: 30px 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    color: #243b55;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    color: #333;
    font-weight: bold;
}

input[type="text"] {
    width: 100%;
    padding: 11px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
}

input[type="text"]:focus {
    border-color: #243b55;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #243b55;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #141e30;
}
</style>

</head>

<body>

<div class="form-container">

<h2>Add Company</h2>

<form action="/createcompany" method="post">

<label>Enter CompanyName:</label>
<input type="text" name="cn" required>

<label>Enter Email:</label>
<input type="text" name="e" required>

<label>Enter Address:</label>
<input type="text" name="ad" required>

<label>Enter Website:</label>
<input type="text" name="w" required>

<label>Enter Description:</label>
<input type="text" name="d" required>

<button type="submit">Add Company</button>

</form>

</div>

</body>
</html>
