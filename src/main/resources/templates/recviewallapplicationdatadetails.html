<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Application Details</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .container {
            width: 700px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 25px;
        }

        .application {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8fafc;
        }

        .application p {
            margin: 10px 0;
            color: #334155;
        }

        .label {
            font-weight: bold;
            color: #4338ca;
        }

        .candidate-title {
            color: #1e293b;
            margin-top: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .dashboard-btn {
            display: block;
            width: 240px;
            margin: 25px auto 0;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            border-radius: 8px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Application Details</h2>

    <div th:each="ap : ${session.appd}" class="application">

        <p>
            <span class="label">ApplicationData Id:</span>
            <span th:text="${ap.appid}"></span>
        </p>

        <p>
            <span class="label">Applied Date:</span>
            <span th:text="${ap.applieddate}"></span>
        </p>

        <p>
            <span class="label">JobId:</span>
            <span th:text="${ap.jid.jid}"></span>
        </p>

        <p>
            <span class="label">JobName:</span>
            <span th:text="${ap.jid.jobtitle}"></span>
        </p>

        <p>
            <span class="label">Cover Letter:</span>
            <span th:text="${ap.coverletter}"></span>
        </p>

        <h3 class="candidate-title">Candidate Details</h3>

        <p>
            <span class="label">Candidate Id:</span>
            <span th:text="${ap.cid.candid}"></span>
        </p>

        <p>
            <span class="label">Candidate Name:</span>
            <span th:text="${ap.cid.name}"></span>
        </p>

        <p>
            <span class="label">Phone Number:</span>
            <span th:text="${ap.cid.phonenum}"></span>
        </p>

        <p>
            <span class="label">Email:</span>
            <span th:text="${ap.cid.email}"></span>
        </p>

        <p>
            <span class="label">Address:</span>
            <span th:text="${ap.cid.address}"></span>
        </p>

    </div>

    <a href="/Recrruiterdashboard" class="dashboard-btn">
        Return Recruiter Dashboard
    </a>

</div>

</body>
</html>
