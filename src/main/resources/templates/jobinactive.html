<!DOCTYPE html>
<html>

<head>

<title>Job Inactive</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    margin: 0;
    padding: 50px;
}

.container {
    width: 500px;
    margin: 80px auto;
    background-color: white;
    padding: 40px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
}

.icon {
    font-size: 55px;
    margin-bottom: 15px;
}

h2 {
    color: #333;
    margin-bottom: 15px;
}

p {
    color: #666;
    font-size: 16px;
    line-height: 1.6;
}

.message {
    background-color: #f8f9fa;
    padding: 15px;
    border-radius: 6px;
    margin-top: 20px;
}

.dashboard {
    margin-top: 25px;
    padding: 12px 25px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
}

.dashboard:hover {
    background-color: #0056b3;
}

</style>

</head>

<body>

<div class="container">

<div class="icon">⚠️</div>

<h2>Job is No Longer Active</h2>

<p>
The job associated with this application is no longer active.
</p>

<div class="message">

<p>
The recruitment process for this job has been stopped.
No further application status changes or interview scheduling can be performed.
</p>

</div>

<a href="/Recrruiterdashboard">
    <button class="dashboard">Recruiter Dashboard</button>
</a>

</div>

</body>

</html>
