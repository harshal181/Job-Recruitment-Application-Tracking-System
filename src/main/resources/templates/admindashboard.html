<html>

<head>

<title>Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Compact Mobile App */
.app {
    width: 340px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.13);
    overflow: hidden;
}

/* Header */
.header {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    padding: 24px 22px 28px;
    color: white;
}

.header .icon {
    width: 52px;
    height: 52px;
    background: rgba(255, 255, 255, 0.20);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    margin-bottom: 13px;
}

.header h3 {
    font-size: 23px;
    margin-bottom: 5px;
}

.header p {
    font-size: 12px;
    opacity: 0.9;
}

/* Menu */
.menu {
    padding: 18px 16px 10px;
}

.menu-title {
    font-size: 11px;
    color: #64748b;
    font-weight: bold;
    margin-bottom: 10px;
    text-transform: uppercase;
}

/* Menu Buttons */
.menu a {
    display: flex;
    align-items: center;
    text-decoration: none;
    background: #f8fafc;
    color: #1e293b;
    padding: 11px;
    margin-bottom: 9px;
    border-radius: 13px;
    border: 1px solid #e2e8f0;
    transition: 0.2s;
}

.menu a:hover {
    background: #eef2ff;
    transform: translateY(-1px);
    border-color: #c7d2fe;
}

/* Icon */
.menu-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    margin-right: 12px;
}

/* Text */
.menu-text {
    font-size: 14px;
    font-weight: bold;
    flex: 1;
}

.arrow {
    font-size: 19px;
    color: #94a3b8;
}

/* Logout */
.logout {
    margin-top: 3px;
}

.logout a {
    background: #fff1f2;
    border-color: #fecdd3;
    color: #be123c;
}

.logout .menu-icon {
    background: #ffe4e6;
}

/* Footer */
.footer {
    text-align: center;
    padding: 3px 15px 16px;
    color: #94a3b8;
    font-size: 10px;
}

</style>

</head>

<body>

<div class="app">

    <!-- Header -->

    <div class="header">

        <div class="icon">
            👨‍💼
        </div>

        <h3>Welcome Admin</h3>

        <p>Manage your recruitment system</p>

    </div>


    <!-- Menu -->

    <div class="menu">

        <div class="menu-title">
            Admin Menu
        </div>


        <a href="/updateAdmin">

            <div class="menu-icon">
                ✏️
            </div>

            <div class="menu-text">
                Update Profile
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <a href="/addcompanyy">

            <div class="menu-icon">
                👥
            </div>

            <div class="menu-text">
                Add Company Details
            </div>

            <div class="arrow">
                ›
            </div>

        </a>



        <a href="/viewallcompany">

            <div class="menu-icon">
                👥
            </div>

            <div class="menu-text">
               View Company Details
            </div>

            <div class="arrow">
                ›
            </div>

        </a>
        
        <a href="/viewallrecruiter">
            <div class="menu-icon">
                👥
            </div>

            <div class="menu-text">
               View Recruiter Details
            </div>

            <div class="arrow">
                >
            </div> 
       
        </a>


        <a href="/viewprofileforadmin">

            <div class="menu-icon">
                👤
            </div>

            <div class="menu-text">
                My Profile
            </div>

            <div class="arrow">
                ›
            </div>

        </a>


        <div class="logout">

            <a href="/logout">

                <div class="menu-icon">
                    🚪
                </div>

                <div class="menu-text">
                    Logout
                </div>

                <div class="arrow">
                    ›
                </div>

            </a>

        </div>

    </div>


    <div class="footer">
        Job Recruitment & Application Tracking System
    </div>

</div>

</body>

</html>
