
<html>

<head>

<title>Recruiter Login</title>

<style>

    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .container {
        width: 430px;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    h2 {
        text-align: center;
        margin: 0 0 30px;
        color: #1e293b;
        font-size: 27px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
    }

    input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #4338ca;
    }

</style>

</head>

<body>

<div class="container">

    <h2>Recruiter Login</h2>

    <form action="/recruiterLogin" method="get" required>

        <div class="form-group">

            <label>Enter RecruiterId:</label>

            <input type="number" name="rrid" required>

        </div>

        <div class="form-group">

            <label>Enter Password:</label>

            <input type="text" name="pp">

        </div>

        <button type="submit">Login</button>

    </form>

</div>

</body>

</html>
